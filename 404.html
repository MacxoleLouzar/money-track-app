<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      const path = window.location.pathname.replace('/money-track-app', '');
      const search = window.location.search;
      const hash = window.location.hash;
      const url = '/money-track-app/?p=' + encodeURIComponent(path + search) + hash;
      window.location.replace(url);
    </script>
  </head>
  <body></body>
</html>
